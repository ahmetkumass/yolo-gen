# YoloGen — single-file configuration.
#
# Copy this file, set `data:` to your dataset.yaml, and run:
#   python train.py --config configs/default.yaml
#
# Advanced features (verification mode, hard-negative mining) live as
# commented-out blocks further down — uncomment to enable.

data: data/your_dataset/dataset.yaml

# ---------------------------------------------------------------------------
# YOLO
# ---------------------------------------------------------------------------
yolo:
  model: yolov8n.pt                  # n / s / m / l / x — n is fastest
  epochs: 100
  batch: 16                          # reduce if OOM
  imgsz: 640

  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 50

  # Loss weights
  box: 7.5
  cls: 0.5
  dfl: 1.5

  # Augmentation
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0

# ---------------------------------------------------------------------------
# VLM
# ---------------------------------------------------------------------------
# 4-bit QLoRA VRAM: Qwen3-VL 2B≈14GB, 4B≈18GB, 8B≈24GB.
# max_pixels dominates memory far more than batch_size — tune that first.
vlm:
  enabled: true
  model: Qwen/Qwen3-VL-4B-Instruct   # 2B / 4B / 8B. Also supports Qwen2.5-VL.

  epochs: 3
  batch_size: 1                      # keep at 1; raise gradient_accumulation instead
  lr: 0.00002
  precision: 4bit                    # 4bit required for <80GB VRAM
  max_samples: 10000                 # null = use all

  # Image size (auto-calculated per model if left null).
  # Small objects → raise max_pixels; low VRAM → lower it.
  # min_pixels: null
  # max_pixels: null

  lora_r: 64
  lora_alpha: 16
  lora_dropout: 0.05
  gradient_checkpointing: true       # saves ~20-30GB; required on most GPUs
  gradient_accumulation: 4           # effective batch = batch_size * this

# ---------------------------------------------------------------------------
# VLM DATASET
# ---------------------------------------------------------------------------
# qa_format picks the task framing:
#   descriptive       : template-based captions (default). Free-form text labels.
#   binary_multiclass : per-bbox Yes/No per class. Emits cross-class negatives
#                       automatically and is a prerequisite for negative_mining.
vlm_dataset:
  qa_format: descriptive

  box_color: [0, 0, 255]             # BGR red
  box_thickness: 3

  system_prompt: |
    You are an object detection assistant.
    When shown an image with a red bounding box, identify and describe
    the object inside the marked area clearly and concisely.

  # Placeholders: {class}, {detail}, {yes_no}, {explanation}
  prompts:
    - question: "What is in the red marked area?"
      answer:   "The red marked area contains a {class}. {detail}"
    - question: "Describe the object inside the red rectangle."
      answer:   "Inside the red rectangle, I can see a {class}. {detail}"

  # Optional per-class descriptions substituted into {detail}.
  # details:
  #   handgun:
  #     - "A small firearm designed for one-handed use."
  #   rifle:
  #     - "A long-barreled firearm designed for precision."

  # -------------------------------------------------------------------------
  # VERIFICATION MODE — uncomment to switch. Pairs with an existing detector
  # to reject false positives. Requires class_prompts for every class in
  # dataset.yaml 'names'.
  # -------------------------------------------------------------------------
  # qa_format: binary_multiclass
  # class_prompts:
  #   handgun: |
  #     You are a security analyst reviewing weapon-detection alerts.
  #     Decide if the red bounding box contains a handgun. Answer Yes or No.
  #   rifle: |
  #     You are a security analyst reviewing weapon-detection alerts.
  #     Decide if the red bounding box contains a long gun (rifle or shotgun).
  #     Answer Yes or No.
  # class_questions:  # optional; auto-filled with a sensible default
  #   handgun: "Is there a handgun in the red bounding box? Answer Yes or No."
  #   rifle:   "Is there a long gun in the red bounding box? Answer Yes or No."

  # -------------------------------------------------------------------------
  # HARD NEGATIVE MINING — detector-free. Requires qa_format: binary_multiclass.
  # Safeguards against labeling a true positive as "No":
  #   (1) IoU exclusion vs every GT bbox in the image
  #   (2) Upper similarity cap (similarity_range[1])
  #   (3) Diversity filter across retained regions
  #   (4) Optional VLM zero-shot double-check (slow, opt-in)
  # -------------------------------------------------------------------------
  # negative_mining:
  #   enabled: true
  #   embedding_model: facebook/dinov2-base
  #   rings: [3.0, 6.0]                # multiples of each GT bbox's min side
  #   stride_per_ring: [50, 80]
  #   similarity_range: [0.25, 0.50]   # DINOv2 hard-neg window
  #   max_per_image: 3
  #   exclude_iou_with_any_gt: 0.1
  #   diversity_iou_threshold: 0.3
  #   batch_size: 32
  #   device: auto                     # auto | cuda | mps | cpu
  #   random_seed: 0
  #   vlm_verify:                      # 4th safeguard — opt-in, slow
  #     enabled: false
  #     model: Qwen/Qwen3-VL-4B-Instruct
  #     prompt: "Is there a {class} in this region? Answer Yes or No."
  #     reject_on_yes: true
  #     max_new_tokens: 4

# ---------------------------------------------------------------------------
# OUTPUT
# ---------------------------------------------------------------------------
output:
  save_dir: runs
  export_onnx: true
